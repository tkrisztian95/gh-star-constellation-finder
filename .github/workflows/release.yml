name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile standalone binaries
        env:
          BAKED_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # When the POSTHOG_API_KEY repo secret is set, inline it into the
          # compiled binary so the released executable ships with the
          # official analytics target. End users can still override at run
          # time by setting their own POSTHOG_API_KEY env var, or opt out
          # entirely with --no-analytics. If the secret is unset (e.g. on
          # a fork's release run), the binary is built without an analytics
          # destination and analytics no-ops cleanly.
          DEFINE_ARGS=()
          if [ -n "${BAKED_POSTHOG_API_KEY:-}" ]; then
            DEFINE_ARGS+=(--define "process.env.BAKED_POSTHOG_API_KEY=\"${BAKED_POSTHOG_API_KEY}\"")
            echo "Baking PostHog project key into release binaries."
          else
            echo "POSTHOG_API_KEY secret not set; binaries will ship without a baked analytics key."
          fi

          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            echo "::group::Building $target"
            bun build src/index.tsx \
              --compile \
              --minify \
              --sourcemap \
              --target="bun-$target" \
              --outfile "dist/gh-star-constellation-finder-$target" \
              "${DEFINE_ARGS[@]}"
            echo "::endgroup::"
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum gh-star-constellation-finder-* > SHA256SUMS

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            dist/gh-star-constellation-finder-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
