name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile standalone binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            echo "::group::Building $target"
            bun build src/index.tsx \
              --compile \
              --minify \
              --sourcemap \
              --target="bun-$target" \
              --outfile "dist/gh-star-constellation-finder-$target"
            echo "::endgroup::"
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum gh-star-constellation-finder-* > SHA256SUMS

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            dist/gh-star-constellation-finder-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
